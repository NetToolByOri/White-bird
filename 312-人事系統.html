function canonicalizePeople(){const bi=id=>{const i=state.settings.builds.findIndex(x=>x.id===id);return i<0?999:i};state.people.sort((a,b)=>(+a.departmentId.slice(1)||1)-(+b.departmentId.slice(1)||1)||bi(a.buildId)-bi(b.buildId)||(b.pinned?1:0)-(a.pinned?1:0)||getOrder('build',a,a.buildId)-getOrder('build',b,b.buildId)||(a.name||'').localeCompare(b.name||'','zh-Hant'))}

function roc(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return'';const [y,m,d]=v.split('-');return`${+y-1911}/${m}/${d}`}
function parseRocDate(value){const raw=String(value||'').trim();if(!raw)return{ok:true,iso:'',display:''};let y,m,d,hit=raw.match(/^(\d{1,3})[/.\-](\d{1,2})[/.\-](\d{1,2})$/);if(hit){y=+hit[1];m=+hit[2];d=+hit[3]}else if(/^\d{5,7}$/.test(raw)){y=+raw.slice(0,-4);m=+raw.slice(-4,-2);d=+raw.slice(-2)}else return{ok:false};if(y<1||m<1||m>12||d<1||d>31)return{ok:false};const west=y+1911,test=new Date(Date.UTC(west,m-1,d));if(test.getUTCFullYear()!==west||test.getUTCMonth()!==m-1||test.getUTCDate()!==d)return{ok:false};const mm=String(m).padStart(2,'0'),dd=String(d).padStart(2,'0');return{ok:true,iso:`${west}-${mm}-${dd}`,display:`${y}/${mm}/${dd}`}}
function readRocDate(id,label){const el=$(id),r=parseRocDate(el.value);el.classList.toggle('date-invalid',!r.ok);if(!r.ok){el.focus();throw Error(`${label}格式或日期不正確，請輸入例如 1150902`)}el.value=r.display;return r.iso}
function tidyRocDate(el){const r=parseRocDate(el.value);el.classList.toggle('date-invalid',!r.ok);if(r.ok)el.value=r.display}
function maskId(s){s=String(s||'');if(!state.settings.maskId||s.length<5)return s;return s.slice(0,2)+'*'.repeat(Math.max(1,s.length-4))+s.slice(-2)}

function person(id){return state.people.find(p=>p.id===id)}

function setOrder(view,p,groupId,value){state.orders[view]??={};const key=view==='business'?businessOrderKey(groupId,p.id):p.id;if(value==='')delete state.orders[view][key];else state.orders[view][key]=Math.max(0,parseInt(value,10)||0);save(true);render()}
function groupData(){const ps=state.people.filter(p=>p.departmentId===state.currentDepartment),v=state.currentView,out=[];if(v==='build'){for(const o of state.settings.builds)out.push({id:o.id,name:o.name,people:ps.filter(p=>p.buildId===o.id)});out.push({id:'unset',name:'未設定',people:ps.filter(p=>!state.settings.builds.some(o=>o.id===p.buildId))})}else if(v==='rank'){for(const [name,ranks] of RANK_GROUPS)out.push({id:name,name,people:ps.filter(p=>ranks.includes(p.rank))});out.push({id:'unset',name:'未設定',people:ps.filter(p=>!RANKS.includes(p.rank))})}else if(v==='business'){for(const o of state.settings.businesses)out.push({id:o.id,name:o.name,people:ps.filter(p=>p.businessIds.includes(o.id))});out.push({id:'unset',name:'未設定',people:ps.filter(p=>!p.businessIds.some(id=>state.settings.businesses.some(o=>o.id===id)))})}else if(state.settings.geoMode==='region'){for(const r of ['北','中','南','東','離島'])out.push({id:r,name:r,people:ps.filter(p=>countyRegion(p.county)===r)});out.push({id:'unset',name:'未設定',people:ps.filter(p=>countyRegion(p.county)==='未設定')})}else{for(const [c] of COUNTIES)out.push({id:c,name:c,people:ps.filter(p=>p.county===c)});out.push({id:'unset',name:'未設定',people:ps.filter(p=>!COUNTIES.some(x=>x[0]===p.county))})}return out.filter(g=>g.people.length)}
function sorter(groupId){const v=state.currentView;return(a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(v==='build'?0:rankIndex(a.rank)-rankIndex(b.rank))||getOrder(v,a,groupId)-getOrder(v,b,groupId)||(a.name||'').localeCompare(b.name||'','zh-Hant')}
function contextText(p){if(state.currentView==='build')return optionName(state.settings.builds,p.buildId);if(state.currentView==='rank')return p.rank||'未設定';if(state.currentView==='business')return p.businessIds.map(id=>optionName(state.settings.businesses,id)).join('、')||'未設定';return state.settings.geoMode==='county'?(p.county||'未設定'):countyRegion(p.county)}
